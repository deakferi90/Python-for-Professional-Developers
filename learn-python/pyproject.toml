[project]
name = "learn-python"
version = "0.1.0"
description = "Learn Python"
readme = "README.md"
authors = [
    { email = "deak_ferenc_jozsef@yahoo.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "pydantic>=2.14.4",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "learn_python.main:app"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
]
